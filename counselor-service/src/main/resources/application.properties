
# ===============================
# Server
# ===============================
server.port=8090
spring.application.name=COUNSELOR-SERVICE

# ===============================
# Eureka Client
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===============================
# Database (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/council_counselor
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Let Hibernate auto-detect dialect (recommended)
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Internal service auth
internal.jwt.secret=InternalServiceJwtSecretKeyThatIsAtLeast32Chars
internal.jwt.expiration.ms=300000

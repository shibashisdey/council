
server.port=8091
spring.application.name=api-gateway

# Eureka connection
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Enable dynamic routing via Eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Actuator
management.endpoints.web.exposure.include=health,info
jwt.secret.key=ThisIsASuperSecureJWTSecretKeyThatIsAtLeast32Chars
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://USER-AUTHENTICATION-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**


# Counselor Service route
spring.cloud.gateway.routes[1].id=counselor-service
spring.cloud.gateway.routes[1].uri=lb://COUNSELOR-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/counselors/**

# User Service route
spring.cloud.gateway.routes[2].id=user-service
spring.cloud.gateway.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/users/**

# Availability Service route
spring.cloud.gateway.routes[3].id=availability-service
spring.cloud.gateway.routes[3].uri=lb://AVAILABILITY-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/availability-service/**


server.port=8091
spring.application.name=api-gateway
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,http://0.0.0.0:*

# Eureka connection
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Enable dynamic routing via Eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Actuator
management.endpoints.web.exposure.include=health,info
jwt.secret.key=ThisIsASuperSecureJWTSecretKeyThatIsAtLeast32Chars
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://USER-AUTHENTICATION-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**


# Counselor Service route
spring.cloud.gateway.routes[1].id=counselor-service
spring.cloud.gateway.routes[1].uri=lb://COUNSELOR-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/counselors/**

# User Service route
spring.cloud.gateway.routes[2].id=user-service
spring.cloud.gateway.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/users/**

# Availability Service route (schedule endpoints)
spring.cloud.gateway.routes[3].id=availability-service
spring.cloud.gateway.routes[3].uri=lb://AVAILABILITY-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/schedule/**

# Availability Service route (internal availability)
spring.cloud.gateway.routes[8].id=availability-internal
spring.cloud.gateway.routes[8].uri=lb://AVAILABILITY-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/internal/availability/**

# Appointment Service route
spring.cloud.gateway.routes[4].id=appointment-service
spring.cloud.gateway.routes[4].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/appointments/**

# Review Service routes
spring.cloud.gateway.routes[5].id=review-service-reviews
spring.cloud.gateway.routes[5].uri=lb://REVIEW-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/reviews/**
spring.cloud.gateway.routes[6].id=review-service-session-notes
spring.cloud.gateway.routes[6].uri=lb://REVIEW-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/session-notes/**

# Payment Service route
spring.cloud.gateway.routes[7].id=payment-service
spring.cloud.gateway.routes[7].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/payments/**

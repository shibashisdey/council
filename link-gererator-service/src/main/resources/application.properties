server.port=8082
spring.application.name=LINK-GERERATOR-SERVICE

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/link_generator_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Link generation
link.generator.base-url=https://meet.jit.si

# Internal service auth
internal.jwt.secret=InternalServiceJwtSecretKeyThatIsAtLeast32Chars
internal.jwt.expiration.ms=300000

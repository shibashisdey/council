<section class="auth-card">
  <h2 class="auth-title">Welcome back</h2>
  <form class="form-grid" (ngSubmit)="login()">
    <div class="form-field">
      <label for="identifier">Email or phone</label>
      <input type="text" id="identifier" [(ngModel)]="credentials.identifier" name="identifier" required>
    </div>
    <div class="form-field">
      <label for="password">Password</label>
      <input type="password" id="password" [(ngModel)]="credentials.password" name="password" required>
    </div>
    <button type="submit" [disabled]="loading">Login</button>
    <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </form>
</section>
